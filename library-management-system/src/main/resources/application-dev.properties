spring.application.name=library-management-system

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Bakliwal@mysql}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.kshitiz.librarymanagementsystem=DEBUG

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Set this as a real environment variable (OPENAI_API_KEY) — never commit a real key here.
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-3.5-turbo

# The ONE account that can add/remove other admins. Set to your own login email.
app.super-admin-email=${SUPER_ADMIN_EMAIL:leader@gmail.com}

# UPI ID that paid-book QR codes will pay into
payment.upi.id=${PAYMENT_UPI_ID:your-upi-id@bank}
